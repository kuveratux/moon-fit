<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c2185b">
  <title>Moon fit.</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Moon fit.</h1>
  </header>

  <main>
    <section id="summary" class="card"></section>

    <div id="backupReminder" class="notice" hidden></div>

    <section class="card">
      <div class="tabs" role="tablist">
        <button type="button" id="viewCal" role="tab">カレンダー</button>
        <button type="button" id="viewTable" role="tab">表</button>
      </div>

      <div id="calView">
        <div class="cal-head">
          <button id="prevMonth" class="icon-btn" aria-label="前の月">‹</button>
          <h2 id="monthLabel"></h2>
          <button id="nextMonth" class="icon-btn" aria-label="次の月">›</button>
        </div>
        <div id="calendar" class="calendar"></div>
        <ul class="legend">
          <li><span class="sw sw-period"></span>記録した生理</li>
          <li><span class="sw sw-predicted"></span>予定（生理）</li>
          <li><span class="sw sw-range"></span>始まる可能性の幅</li>
          <li><span class="mk mk-ovulation">✦</span>排卵日の目安</li>
          <li><span class="mk mk-note"></span>体調メモあり</li>
        </ul>
        <p class="small">日付を押すと、その日の体調メモを書けます。</p>
        <div id="monthNotes" class="month-notes"></div>
      </div>

      <div id="tableView" hidden>
        <div class="table-wrap">
          <table class="cycle-table">
            <thead>
              <tr><th>開始日</th><th>日数</th><th>周期</th><th>排卵日の目安</th><th>量</th></tr>
            </thead>
            <tbody id="cycleTable"></tbody>
          </table>
        </div>
        <p class="small">周期は、その開始日から次の開始日までの日数です。</p>
      </div>
    </section>

    <section class="card">
      <h2 id="formTitle">記録する</h2>
      <form id="periodForm">
        <label>始まった日<input type="date" id="startInput" required></label>
        <label>終わった日（まだなら空のまま）<input type="date" id="endInput"></label>
        <label>量
          <select id="flowInput">
            <option value="light">少なめ</option>
            <option value="normal" selected>ふつう</option>
            <option value="heavy">多め</option>
          </select>
        </label>
        <p id="formError" class="error" hidden></p>
        <div class="row">
          <button type="submit" class="primary">保存</button>
          <button type="button" id="cancelEdit" hidden>やめる</button>
        </div>
      </form>
      <div id="quickActions" class="row"></div>
    </section>

    <section class="card">
      <h2>これまでの記録</h2>
      <ul id="history" class="history"></ul>
    </section>

    <section class="card">
      <h2 id="notesTitle">体調メモ</h2>
      <ul id="notesList" class="history"></ul>
    </section>

    <section class="card">
      <h2>バックアップ</h2>
      <p class="small">記録は暗号化してファイルに書き出します。読み込みには書き出したときの合言葉が必要です。<strong>合言葉を忘れると、誰にも元に戻せません。</strong></p>
      <div class="row">
        <button id="exportBtn">書き出す</button>
        <button id="importBtn">読み込む</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
      <p id="lastBackup" class="small"></p>
    </section>

    <p class="small disclaimer">予測は記録からの目安です。</p>
  </main>

  <dialog id="passDialog">
    <form method="dialog" id="passForm">
      <h2 id="passTitle"></h2>
      <p id="passHelp" class="small"></p>
      <label>合言葉<input type="password" id="pass1" autocomplete="off"></label>
      <label id="pass2Label">もう一度<input type="password" id="pass2" autocomplete="off"></label>
      <p id="passError" class="error" hidden></p>
      <div class="row">
        <button type="submit" value="ok" class="primary" id="passOk">OK</button>
        <button type="submit" value="cancel" formnovalidate>やめる</button>
      </div>
    </form>
  </dialog>

  <dialog id="dayDialog">
    <form method="dialog" id="dayForm">
      <h2 id="dayTitle"></h2>
      <p id="dayInfo" class="small"></p>
      <label>体調メモ<textarea id="noteInput" rows="5" placeholder="例：朝から頭が重い。夜は早めに寝た。"></textarea></label>
      <div class="row">
        <button type="submit" value="save" class="primary">メモを保存</button>
        <button type="submit" value="close">閉じる</button>
      </div>
      <div class="row day-extra">
        <button type="submit" value="start" id="dayStartBtn">この日を生理の開始日にする</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
